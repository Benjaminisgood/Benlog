{% extends "base.html" %}
{% block content %}
<h1 class="page-heading">📄 笔记管理</h1>
<p class="welcome-message">欢迎您，{{ current_user.username }}！</p>

<div class="create-upload-container">
  <!-- 新建笔记 -->
  <form method="POST" action="{{ url_for('edu.new_note') }}" class="create-note-form">
    <button type="submit" class="btn btn-create">创建</button>
  </form>

  <!-- 上传笔记 -->
  <form method="POST"
        action="{{ url_for('edu.upload_note') }}"
        enctype="multipart/form-data"
        class="upload-note-form">
    <input type="file"
           name="note_file"
           accept=".md,.html"
           required />
    <button type="submit" class="btn btn-upload">上传</button>
  </form>
</div>


<hr>

<ul class="note-list">
  {% for note in notes %}
    <li class="note-item">
      <strong>{{ note.slug }}</strong> -
      Last Modified: {{ note.last_modified.strftime('%Y-%m-%d %H:%M:%S') }}
      [<a href="{{ url_for('edu.edit_note', slug=note.slug) }}" class="btn btn-edit">编辑</a>]
    </li>
  {% endfor %}
</ul>

<!-- 局部CSS样式 -->
<style>
  /* 页面标题 */
  .page-heading {
    text-align: center;
    color: var(--text-color); /* 使用全局文本颜色 */
    margin-bottom: 20px;
    font-size: 2rem;
  }

  /* 欢迎信息 */
  .welcome-message {
    text-align: center;
    font-size: 1.2rem;
    color: var(--meta-text-color); /* 使用全局元数据文本颜色 */
    margin-bottom: 20px;
  }

  /* 新建笔记部分 */
  .section-heading {
    color: var(--text-color); /* 使用全局文本颜色 */
    margin-bottom: 10px;
    font-size: 1.5rem;
    text-align: center;
  }

  /* shangchuan笔记部分 */
  .create-upload-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 30px;
  }
  .upload-note-form input[type="file"] {
    /* 调整文件选择框样式 */
    margin-right: 10px;
  }
  .btn-upload {
    background-color: var(--btn-bg-color);
  }
  .btn-upload:hover {
    background-color: var(--btn-hover-bg-color);
  }

  /* 创建笔记表单 */
  .create-note-form {
    text-align: center;
    margin-bottom: 30px;
  }

  .btn {
    padding: 10px 15px;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.3s;
  }

  .btn-create {
    background-color: var(--btn-bg-color); /* 使用全局按钮背景色 */
  }

  .btn-create:hover {
    background-color: var(--btn-hover-bg-color); /* 使用全局按钮悬停背景色 */
  }

  .btn-edit {
    background-color: #ffc107;
  }

  .btn-edit:hover {
    background-color: #e0a800;
  }

  .btn-back {
    background-color: #28a745;
    display: inline-block;
    margin-top: 20px;
  }

  .btn-back:hover {
    background-color: #218838;
  }

  /* 笔记列表 */
  .note-list {
    list-style: none;
    padding: 0;
  }

  .note-item {
    margin: 15px 0;
    background-color: var(--card-bg-color); /* 使用全局卡片背景色 */
    border: 1px solid var(--card-border-color); /* 使用全局边框颜色 */
    border-radius: 8px;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .note-item a {
    text-decoration: none;
    color: var(--link-color); /* 使用全局链接颜色 */
    font-weight: bold;
  }

  .note-item a:hover {
    color: var(--text-color); /* 悬停时使用全局文本颜色 */
    text-decoration: underline;
  }

  /* 响应式设计：适配小屏幕 */
  @media (max-width: 768px) {
    .page-heading {
      font-size: 1.5rem;
    }

    .section-heading {
      font-size: 1.3rem;
    }

    .note-item {
      font-size: 0.9rem;
    }
  }
</style>

{% endblock %}
