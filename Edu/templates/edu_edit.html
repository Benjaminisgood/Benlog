{% extends "base.html" %}

{% block content %}
<div class="page-shell">
  <section class="page-hero-card">
    <div class="page-hero-main">
      <span class="hero-badge">Edu 编辑</span>
      <h1 class="hero-title">编辑笔记</h1>
      <p class="hero-subtitle">当前笔记：<strong>{{ slug }}</strong>。统一的卡片布局让学习内容维护更轻松。</p>
    </div>
    <div class="page-hero-aside">
      <div class="hero-stats">
        <strong>{{ current_user.username }}</strong>
        <span>编辑者</span>
      </div>
    </div>
  </section>

  <section class="card-panel form-card">
    <form method="POST"
          action="{{ url_for('edu.rename_note', slug=slug) }}"
          class="form-stack">
      <div class="form-group">
        <label for="new_slug">重命名为</label>
        <input
          type="text"
          name="new_slug"
          id="new_slug"
          value="{{ slug }}"
          class="form-control"
          required
        >
      </div>
      <div class="form-footer">
        <button type="submit" class="glass-btn alt">重命名</button>
      </div>
    </form>
  </section>

  <section class="card-panel form-card">
    <form method="POST"
          action="{{ url_for('edu.edit_note', slug=slug) }}"
          class="form-stack">
      <div class="form-group">
        <label for="content">正文内容</label>
        <textarea
          name="content"
          id="content"
          rows="20"
          class="form-control textarea-field editor-field"
          required
        >{{ content }}</textarea>
      </div>
      <div class="form-footer">
        <a href="{{ url_for('edu.manage_notes') }}" class="glass-btn ghost align-left">返回列表</a>
        <button type="submit" class="glass-btn">保存内容</button>
      </div>
    </form>
  </section>
</div>
{% endblock %}
