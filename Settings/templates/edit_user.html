{% extends "base.html" %}
{% block content %}
<div class="page-shell">
  <section class="page-hero-card">
    <div class="page-hero-main">
      <span class="hero-badge">编辑用户</span>
      <h1 class="hero-title">调整账户数据 · {{ user.username }}</h1>
      <p class="hero-subtitle">修改基础信息或重置密码，随时掌控权限状态。</p>
    </div>
  </section>

  <section class="card-panel form-card">
    <form method="POST" class="form-stack">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" name="username" id="username" class="form-control" value="{{ user.username }}" required>
      </div>
      <div class="form-group">
        <label for="email">邮箱</label>
        <input type="email" name="email" id="email" class="form-control" value="{{ user.email }}" required>
      </div>
      <div class="form-group">
        <label class="checkbox-chip">
          <input type="checkbox" name="is_admin" id="is_admin" {% if user.is_admin %}checked{% endif %}>
          <span>管理员权限</span>
        </label>
      </div>

      <div class="form-divider emphasis"></div>

      <div class="form-group">
        <label for="password">修改密码（可选）</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="留空表示保持不变">
      </div>

      <div class="form-footer">
        <a href="{{ url_for('setting.manage_users') }}" class="glass-btn ghost align-left">取消</a>
        <button type="submit" class="glass-btn">
          <span class="btn-text">保存修改</span>
        </button>
      </div>
    </form>
  </section>

  <section class="card-panel danger">
    <div class="card-panel-header">
      <div>
        <h2 class="card-panel-title">危险操作</h2>
        <p class="card-panel-subtitle">删除用户将移除其登录能力且不可恢复，请谨慎操作。</p>
      </div>
    </div>
    <form action="{{ url_for('setting.delete_user', user_id=user.id) }}" method="POST" onsubmit="return confirm('确认删除此用户吗？');">
      <div class="form-footer">
        <button type="submit" class="glass-btn danger">
          <span class="btn-text">删除用户</span>
        </button>
      </div>
    </form>
  </section>
</div>
{% endblock %}
