{% extends "base.html" %}
{% block extra_styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}
{% block content %}
<section class="auth-wrapper">
  <article class="auth-card glass-card">
    <header>
      <p class="auth-badge">登录后台</p>
      <h1>欢迎继续创作</h1>
      <p class="auth-sub">输入邮箱与密码，开启今日的工作流。</p>
    </header>
    <form method="POST" class="auth-form">
      <label for="email">邮箱</label>
      <input type="email" name="email" id="email" required placeholder="name@example.com">

      <label for="password">密码</label>
      <input type="password" name="password" id="password" required placeholder="请输入密码">

      <label class="checkbox-field">
        <input type="checkbox" name="remember" id="remember">
        <span>记住登录状态</span>
      </label>

      <button type="submit" class="primary-btn full">登录</button>
    </form>

    <footer class="auth-footer">
      {% if needs_setup %}
        <span>还没有管理员？</span>
        <a href="{{ url_for('setting.setup') }}">创建第一位管理员</a>
      {% elif allow_registration %}
        <span>没有账户？</span>
        <a href="{{ url_for('setting.register') }}">立即注册</a>
      {% else %}
        <span>账号由管理员创建。</span>
      {% endif %}
    </footer>
  </article>
</section>
{% endblock %}
