{% extends "base.html" %}
{% block content %}
<div class="container">
  <h1 class="page-heading">新建动态页面</h1>
  <form method="POST" class="edit-page-form">
    <label for="title">页面文件名（title）：</label>
    <input id="title" name="title" type="text" class="input-field"
           placeholder="仅限字母、数字、下划线和中划线"
           required><br><br>
    <button type="submit" class="btn btn-save">创建并编辑</button>
    <a href="{{ url_for('setting.manage_dynamic_page') }}" class="btn">取消</a>
  </form>
</div>

<style>
.container      { padding:20px; max-width:600px; margin:0 auto; }
.page-heading   { text-align:center; margin-bottom:20px; font-size:2rem; }
.edit-page-form { background:var(--card-bg-color); padding:20px; border-radius:8px; }
.input-field    { width:100%; padding:10px; margin-bottom:15px; border-radius:6px; }
.btn-save, .btn { padding:8px 12px; margin-right:10px; border:none; border-radius:6px; cursor:pointer; }
</style>
{% endblock %}
