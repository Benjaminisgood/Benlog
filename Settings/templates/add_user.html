{% extends "base.html" %}
{% block content %}
<div class="page-shell">
  <section class="page-hero-card">
    <div class="page-hero-main">
      <span class="hero-badge">新增用户</span>
      <h1 class="hero-title">创建新的后台账号</h1>
      <p class="hero-subtitle">填写基础信息并可选赋予管理员权限，支持即时生效。</p>
    </div>
  </section>

  <section class="card-panel form-card">
    <form method="POST" class="form-stack">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" name="username" id="username" class="form-control" placeholder="输入用户名" required>
      </div>
      <div class="form-group">
        <label for="email">邮箱</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="设置登录密码" required>
      </div>
      <div class="form-group">
        <label class="checkbox-chip">
          <input type="checkbox" name="is_admin" id="is_admin">
          <span>赋予管理员权限</span>
        </label>
      </div>
      <div class="form-footer">
        <a href="{{ url_for('setting.manage_users') }}" class="glass-btn ghost align-left">取消</a>
        <button type="submit" class="glass-btn">
          <span class="btn-text">创建用户</span>
        </button>
      </div>
    </form>
  </section>
</div>
{% endblock %}
