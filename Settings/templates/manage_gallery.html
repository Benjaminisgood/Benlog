{% extends "base.html" %}
{% block content %}

<style>
.gallery-grid {
  column-count: 4;
  column-gap: 1rem;
}
@media (max-width: 1200px) {
  .gallery-grid {
    column-count: 3;
  }
}
@media (max-width: 768px) {
  .gallery-grid {
    column-count: 2;
  }
}
@media (max-width: 480px) {
  .gallery-grid {
    column-count: 1;
  }
}

.photo-card {
  break-inside: avoid;
  margin-bottom: 1rem;
  position: relative;
  background-color: var(--card-bg-color);
  border-radius: 0.5rem;
  overflow: hidden;
}

.photo-card img {
  width: 100%;
  display: block;
  border-radius: 0.5rem;
}

.photo-card form {
  position: absolute;
  top: 8px;
  right: 8px;
}

/* 拖拽上传区域样式 */
#drop-area {
  border: 2px dashed #ccc;
  border-radius: 8px;
  padding: 2rem;
  text-align: center;
  margin-bottom: 2rem;
  background-color: rgba(255,255,255,0.05);
  transition: border-color 0.3s ease;
}
#drop-area.highlight {
  border-color: var(--primary-color);
}
#drop-area input {
  display: none;
}
#gallery-upload-btn {
  margin-top: 1rem;
}
</style>

<div id="drop-area">
  <form id="upload-form" method="POST" enctype="multipart/form-data">
    <p>拖拽图片到这里，或点击选择</p>
    <input type="file" id="fileElem" name="photos" multiple accept="image/*">
    <label class="button" for="fileElem" style="cursor: pointer; padding: 0.5rem 1rem; border-radius: 5px; background: var(--button-bg);">选择图片</label>
    <br>
    <button type="submit" id="gallery-upload-btn">上传</button>
  </form>
</div>

<hr>

<div class="gallery-grid">
  {% for image in images %}
    <div class="photo-card">
      <form method="post" action="{{ url_for('setting.gallery_delete', key=image.key) }}">
        <input type="hidden" name="key" value="{{ image.key }}">
        <button type="submit">🗑</button>
      </form>
      <img data-src="{{ image.url }}" alt="{{ image.key }}" class="lazy-img" loading="lazy">
    </div>
  {% else %}
    <p>暂无图片。</p>
  {% endfor %}
</div>

<!-- 拖拽上传脚本 -->
<script>
const dropArea = document.getElementById("drop-area");
const fileInput = document.getElementById("fileElem");
const form = document.getElementById("upload-form");

['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
  dropArea.addEventListener(eventName, e => {
    e.preventDefault();
    e.stopPropagation();
  }, false);
});

['dragenter', 'dragover'].forEach(eventName => {
  dropArea.addEventListener(eventName, () => dropArea.classList.add('highlight'), false);
});

['dragleave', 'drop'].forEach(eventName => {
  dropArea.addEventListener(eventName, () => dropArea.classList.remove('highlight'), false);
});

dropArea.addEventListener('drop', function(e) {
  const dt = e.dataTransfer;
  const files = dt.files;
  fileInput.files = files;
});
</script>

<!-- 懒加载脚本 -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  const lazyImages = document.querySelectorAll('img.lazy-img');

  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          img.src = img.dataset.src;
          img.classList.remove('lazy-img');
          obs.unobserve(img);
        }
      });
    });
    lazyImages.forEach(img => observer.observe(img));
  } else {
    // fallback：立即加载所有图片
    lazyImages.forEach(img => {
      img.src = img.dataset.src;
      img.classList.remove('lazy-img');
    });
  }
});
</script>

{% endblock %}
