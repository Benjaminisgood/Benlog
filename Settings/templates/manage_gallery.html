{% extends "base.html" %}
{% block content %}

<style>
.gallery-visibility-container {
  max-width: 720px;
  margin: auto;
  background: var(--card-bg-color);
  border: 1px solid var(--card-border-color);
  border-radius: 12px;
  padding: 2rem;
  box-shadow: 0 4px 16px rgba(0,0,0,0.05);
  transition: background 0.3s, color 0.3s;
}

.gallery-visibility-container h2 {
  color: var(--heading-color);
  text-align: center;
  margin-bottom: 1rem;
}

.album-search {
  margin-bottom: 1.5rem;
  display: flex;
  justify-content: center;
}

.album-search input[type="text"] {
  padding: 0.5rem 1rem;
  border: 1px solid var(--input-border-color);
  border-radius: 6px;
  width: 100%;
  max-width: 400px;
  background-color: var(--input-bg-color);
  color: var(--text-color);
  font-size: 1rem;
}

.album-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.album-list li {
  background: var(--quick-card-bg);
  border: 1px solid var(--card-border-color);
  border-radius: 8px;
  margin-bottom: 0.75rem;
  padding: 0.75rem 1rem;
  display: flex;
  flex-direction: column;
  transition: background 0.3s, transform 0.3s;
}

.album-list li:hover {
  background: var(--quick-card-hover-bg);
  transform: translateY(-1px);
}

.album-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}

.album-list input[type="checkbox"] {
  margin-right: 0.75rem;
  transform: scale(1.2);
  accent-color: var(--btn-bg-color);
}

.album-list label {
  flex-grow: 1;
  color: var(--text-color);
  font-size: 1rem;
  word-break: break-all;
}

.album-note-input {
  margin-top: 0.5rem;
  font-size: 0.95rem;
  padding: 0.4rem 0.6rem;
  border: 1px solid var(--input-border-color);
  border-radius: 6px;
  background-color: var(--input-bg-color);
  color: var(--text-color);
  width: 100%;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.album-note-input:focus {
  outline: none;
  border-color: var(--input-focus-border-color);
  box-shadow: 0 0 0 2px rgba(51, 102, 204, 0.2);
}

.save-btn {
  display: block;
  width: 100%;
  margin-top: 2rem;
  padding: 0.75rem;
  font-size: 1rem;
  font-weight: bold;
  background-color: var(--btn-bg-color);
  color: var(--btn-text-color);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.3s;
}

.save-btn:hover {
  background-color: var(--btn-hover-bg-color);
}

@media (max-width: 600px) {
  .gallery-visibility-container {
    padding: 1rem;
  }

  .album-note-input {
    font-size: 0.9rem;
  }
}
</style>

<div class="gallery-visibility-container">
  <h2>📁 相册路径显示控制</h2>
  <p>✅ 勾选的路径将在首页显示；未勾选将被隐藏。</p>

  <form method="post">
    <div class="album-search">
      <input type="text" id="searchInput" placeholder="🔍 搜索路径..." onkeyup="filterAlbums()">
    </div>

    <ul class="album-list" id="albumList">
      {% for album in all_albums %}
        <li>
          <div class="album-top">
            <input type="checkbox" name="visible_albums" value="{{ album }}"
                  id="album_{{ loop.index }}"
                  {% if visible_albums.get(album, {}).get('visible', False) %}checked{% endif %}>
            <label for="album_{{ loop.index }}">{{ album }}</label>
          </div>
          <input type="text"
                class="album-note-input"
                name="note_{{ album.strip('/') }}"
                value="{{ visible_albums[album].note if album in visible_albums else '' }}"
                placeholder="✏️ 添加备注（如 婚礼、旅行...）" />
        </li>
      {% endfor %}
    </ul>

    <button type="submit" class="save-btn">💾 保存设置</button>
  </form>
</div>

<script>
function filterAlbums() {
  const input = document.getElementById('searchInput');
  const filter = input.value.toLowerCase();
  const albumList = document.getElementById('albumList');
  const items = albumList.getElementsByTagName('li');

  for (let i = 0; i < items.length; i++) {
    const label = items[i].getElementsByTagName("label")[0];
    const text = label.textContent || label.innerText;
    items[i].style.display = text.toLowerCase().includes(filter) ? "" : "none";
  }
}
</script>

{% endblock %}
