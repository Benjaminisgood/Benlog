{% extends "base.html" %}
{% block content %}
  <style>
  /* 瀑布流布局 */
    .album-item {
    position: relative;
    }
    .album-title {
      position: absolute;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      color: white;
      width: 100%;
      text-align: center;
      font-weight: bold;
      padding: 0.3rem;
      font-size: 0.9rem;
    }
      .album-list {
      column-count: 4;
      column-gap: 1rem;
      padding: 0;
      margin: 1rem 0;
      list-style: none;
    }
    .album-item {
      break-inside: avoid;
      margin-bottom: 1rem;
      position: relative;
      overflow: hidden;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .album-item:hover {
      transform: translateY(-5px);
    }
    .album-item img {
      width: 100%;
      display: block;
      border-radius: 0.5rem;
    }
    .album-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 1.1rem;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    .album-item:hover .album-overlay {
      opacity: 1;
    }
  </style>

  <ul class="album-list">
    {% for album in albums %}
      <li class="album-item">
        <a href="{{ url_for('gallery.index', prefix=album.prefix) }}">
          {% if album.cover_url %}
            <img src="{{ album.cover_url }}" alt="{{ album.name }}" />
          {% else %}
            <div class="no-cover">No Cover</div>
          {% endif %}
          <div class="album-title">{{ album.name }}</div>
        </a>
      </li>
    {% endfor %}
  </ul>

{% endblock %}
