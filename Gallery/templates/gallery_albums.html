<!-- Gallery/templates/gallery_albums.html -->
{% extends "base.html" %}
{% block content %}
  <style>
    .album-list {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      list-style: none;
      padding: 0;
      margin: 1rem 0;
    }
    .album-item {
      background-color: var(--card-bg-color);
      border: 1px solid var(--card-border-color);
      border-radius: 0.5rem;
      overflow: hidden;
      width: 200px;
      text-align: center;
      transition: transform 0.2s;
    }
    .album-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .album-item a {
      display: block;
      padding: 1rem;
      color: var(--link-color);
      text-decoration: none;
      font-weight: 500;
    }
    .album-item a:hover {
      text-decoration: underline;
    }
    .no-albums {
      color: var(--meta-text-color);
      font-style: italic;
      margin: 1rem 0;
    }
  </style>

  <h2>Gallery - Albums</h2>
  <ul class="album-list">
    {% for album in albums %}
      <li class="album-item">
        <a href="{{ url_for('gallery.index', prefix=album) }}">{{ album.rstrip('/') }}</a>
      </li>
    {% else %}
      <li class="no-albums">No albums found.</li>
    {% endfor %}
  </ul>
{% endblock %}
