{% extends "base.html" %}
{% block extra_styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
{% endblock %}
{% block content %}
<div class="album-stream">
  <div class="grid-sizer"></div>
  {% for album in albums %}
    <div class="album-item">
      <a href="{{ url_for('gallery.index', prefix=album.prefix) }}">
        <div class="album-card">
          {% if album.cover_url %}
            <img
              class="lazy-img"
              src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
              data-src="{{ album.cover_url }}"
              alt="{{ album.name }}"
            />
          {% else %}
            <div class="no-cover">No Cover</div>
          {% endif %}
          <div class="album-title">{{ album.name }}</div>
        </div>
      </a>
    </div>
  {% endfor %}
</div>

<!-- 必要依赖 -->
<script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
<script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const grid = document.querySelector('.album-stream');
    const supportsGridLanes = window.CSS && CSS.supports && CSS.supports('display', 'grid-lanes');

    const msnry = supportsGridLanes
      ? null
      : new Masonry(grid, {
          itemSelector: '.album-item',
          columnWidth: '.grid-sizer',
          percentPosition: true,
          gutter: 0
        });

    // 懒加载处理
    const lazyImages = document.querySelectorAll('img.lazy-img');

    const markLoaded = (img) => {
      if (img.dataset.loaded) {
        return;
      }
      img.dataset.loaded = 'true';
      img.classList.add('is-loaded');
      if (msnry) {
        imagesLoaded(grid, () => msnry.layout());
      }
    };

    const loadImage = (img) => {
      const src = img.dataset.src;
      if (!src) {
        return;
      }
      img.onload = () => markLoaded(img);
      img.src = src;
      if (img.complete) {
        markLoaded(img);
      }
    };

    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            loadImage(entry.target);
            observer.unobserve(entry.target);
          }
        });
      });

      lazyImages.forEach(img => observer.observe(img));
    } else {
      // fallback: 不支持懒加载的浏览器
      lazyImages.forEach(loadImage);
    }

    // 初始布局
    if (msnry) {
      imagesLoaded(grid, () => msnry.layout());
    }
  });
</script>
{% endblock %}
