<!-- Gallery/templates/gallery_index_stream.html -->
{% extends "base.html" %}
{% block content %}
  <style>
    /* 瀑布流式照片流样式 */
    .photo-stream {
      column-count: 4;
      column-gap: 1rem;
      padding: 0;
      margin: 1rem 0;
      list-style: none;
    }
    .photo-item {
      break-inside: avoid;
      position: relative;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .photo-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .photo-item img {
      width: 100%;
      display: block;
      border-radius: 0.5rem;
    }
    .photo-desc {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 0.5rem;
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 0.9rem;
      border-bottom-left-radius: 0.5rem;
      border-bottom-right-radius: 0.5rem;
    }
    .photo-item:hover .photo-desc {
      opacity: 1;
    }
  </style>

  <h2>Photo Stream{% if prefix %} - {{ prefix.rstrip('/') }}{% endif %}</h2>
  <ul class="photo-stream">
    {% for f in files %}
      <li class="photo-item" onclick="basicLightbox.create('<img src=\'{{ f.url }}\' style=\'max-width:90vw; max-height:90vh;\' />').show();">
        <img src="{{ f.url }}" alt="{{ f.key }}">
        <div class="photo-desc">{{ f.key }}</div>
      </li>
    {% else %}
      <li style="color: var(--meta-text-color); font-style: italic;">No photos available.</li>
    {% endfor %}
  </ul>

  <!-- Lightbox Script -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basiclightbox@5/dist/basicLightbox.min.css">
  <script src="https://cdn.jsdelivr.net/npm/basiclightbox@5/dist/basicLightbox.min.js"></script>
{% endblock %}
