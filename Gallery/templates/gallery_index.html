{% extends "base.html" %}
{% block extra_styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basiclightbox@5/dist/basicLightbox.min.css">
{% endblock %}
{% block content %}
  <h2>Photo Stream{% if prefix %} - {{ prefix.rstrip('/') }}{% endif %}</h2>
  <div class="photo-stream">
    <div class="grid-sizer"></div> <!-- Masonry column baseline -->
    {% for f in files %}
      <div class="photo-item">
        <div class="photo-card">
          <img
            src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" 
            data-src="{{ f.thumb_url }}" 
            data-full="{{ f.full_url }}" 
            alt="{{ f.key }}" 
            class="lazy-img" 
            loading="lazy" 
          />
          <div class="photo-desc">{{ f.key }}</div>
        </div>
      </div>
    {% else %}
      <div class="photo-empty">No photos available.</div>
    {% endfor %}
  </div>

  {% if bg_audio_url %}
    <audio id="bg-music" src="{{ bg_audio_url }}" autoplay loop muted></audio>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const audio = document.getElementById("bg-music");
        setTimeout(() => { audio.muted = false; }, 1000);
      });
    </script>
  {% endif %}

  <!-- Lightbox -->
  <script src="https://cdn.jsdelivr.net/npm/basiclightbox@5/dist/basicLightbox.min.js"></script>


  <!-- Masonry + imagesLoaded -->
  <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
  <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const grid = document.querySelector('.photo-stream');
      const lazyImages = document.querySelectorAll('img.lazy-img');
      const supportsGridLanes = window.CSS && CSS.supports && CSS.supports('display', 'grid-lanes');

      const msnry = supportsGridLanes
        ? null
        : new Masonry(grid, {
            itemSelector: '.photo-item',
            columnWidth: '.grid-sizer',
            percentPosition: true,
            gutter: 0
          });

      const markLoaded = (img) => {
        if (img.dataset.loaded) {
          return;
        }
        img.dataset.loaded = 'true';
        img.classList.add('is-loaded');
        if (msnry) {
          imagesLoaded(grid, () => msnry.layout());
        }
      };

      const loadImage = (img) => {
        const src = img.dataset.src;
        if (!src) {
          return;
        }
        img.onload = () => markLoaded(img);
        img.src = src;
        if (img.complete) {
          markLoaded(img);
        }
      };

      // 使用 IntersectionObserver 懒加载
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver(function (entries) {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              loadImage(entry.target);
              observer.unobserve(entry.target);
            }
          });
        });

        lazyImages.forEach(img => observer.observe(img));
      } else {
        // fallback: 立即加载所有图
        lazyImages.forEach(loadImage);
      }

      if (msnry) {
        imagesLoaded(grid, () => msnry.layout());
      }

      // 点击图片放大：优先使用 data-full，再回退到当前 src
      document.addEventListener('click', function (e) {
        if (e.target.matches('.photo-item img')) {
          const fullSrc = e.target.dataset.full || e.target.src;
          basicLightbox
            .create(
              `<img src="${fullSrc}" class="lightbox-image" alt="">`
            )
            .show();
        }
      });
    });
  </script>
{% endblock %}
