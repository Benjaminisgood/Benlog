{% extends "base.html" %}

{% block content %}
<h1 style="text-align:center;color:var(--heading-color);margin:1.5rem 0;">
  所有画廊
</h1>

<ul class="gallery-grid">
  {% for folder in galleries %}
    <li class="gallery-card">
      <div class="card-main">
        <span class="card-title">{{ folder.replace('_', ' ').title() }}</span>
        <div class="card-actions">
          <a class="btn-view"
             href="{{ url_for('gallery.gallery_page', folder=folder) }}">查看</a>
          <a class="btn-edit"
             href="{{ url_for('gallery.view_folder', folder_name=folder) }}">编辑</a>
        </div>
      </div>
    </li>
  {% endfor %}
</ul>

<style>
  /* ===== 布局 ===== */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
    padding: 0;
    margin: 0 0 2rem;
    list-style: none;
  }

  /* ===== 卡片 ===== */
  .gallery-card {
    background: var(--card-bg-color);
    border: 1px solid var(--card-border-color);
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    transition: transform .25s, box-shadow .25s;
  }
  .gallery-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.1);
  }

  .card-main { padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; }

  .card-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-color);
    word-break: break-all;
  }

  /* ===== 按钮 ===== */
  .card-actions { display: flex; gap: .6rem; }
  .card-actions a {
    flex: 1 1 0;
    text-align: center;
    padding: .45rem .6rem;
    border-radius: 6px;
    font-size: .9rem;
    font-weight: 500;
    text-decoration: none;
    color: var(--btn-text-color);
    background: var(--btn-bg-color);
    transition: background .25s;
  }
  .card-actions a:hover {
    background: var(--btn-hover-bg-color);
  }

  /* 暗色模式下按钮阴影微弱即可 */
  [data-theme="dark"] .gallery-card {
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
</style>
{% endblock %}
