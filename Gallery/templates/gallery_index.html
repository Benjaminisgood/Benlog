{% extends "base.html" %}
{% block content %}
  <style>
    .photo-stream {
      column-count: 4;
      column-gap: 1rem;
      padding: 0;
      margin: 1rem 0;
      list-style: none;
    }
    @media (max-width: 1200px) {
      .photo-stream {
        column-count: 3;
      }
    }
    @media (max-width: 768px) {
      .photo-stream {
        column-count: 2;
      }
    }
    @media (max-width: 480px) {
      .photo-stream {
        column-count: 1;
      }
    }
    .photo-item {
      break-inside: avoid;
      position: relative;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .photo-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .photo-item img {
      width: 100%;
      display: block;
      border-radius: 0.5rem;
    }
    .photo-desc {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 0.5rem;
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 0.9rem;
      border-bottom-left-radius: 0.5rem;
      border-bottom-right-radius: 0.5rem;
    }
    .photo-item:hover .photo-desc {
      opacity: 1;
    }
  </style>

  <h2>Photo Stream{% if prefix %} - {{ prefix.rstrip('/') }}{% endif %}</h2>
  <ul class="photo-stream">
    {% for f in files %}
      <li class="photo-item">
        <img
          data-src="{{ f.url }}"
          alt="{{ f.key }}"
          class="lazy-img"
          loading="lazy"
        >
        <div class="photo-desc">{{ f.key }}</div>
      </li>
    {% else %}
      <li style="color: var(--meta-text-color); font-style: italic;">No photos available.</li>
    {% endfor %}
  </ul>

  <!-- Lightbox (点击图片放大) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basiclightbox@5/dist/basicLightbox.min.css">
  <script src="https://cdn.jsdelivr.net/npm/basiclightbox@5/dist/basicLightbox.min.js"></script>

  <!-- 懒加载脚本 -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const lazyImages = document.querySelectorAll('img.lazy-img');

      if ('IntersectionObserver' in window) {
        let observer = new IntersectionObserver(function (entries, observer) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              const img = entry.target;
              img.src = img.dataset.src;
              img.classList.remove("lazy-img");
              observer.unobserve(img);
            }
          });
        });
        lazyImages.forEach(img => observer.observe(img));
      } else {
        // Fallback: load all images immediately
        lazyImages.forEach(img => {
          img.src = img.dataset.src;
          img.classList.remove("lazy-img");
        });
      }
    });

    // Lightbox click handler
    document.addEventListener('click', function (e) {
      if (e.target.matches('.photo-item img')) {
        const src = e.target.src;
        basicLightbox.create(`<img src='${src}' style='max-width:90vw; max-height:90vh;'>`).show();
      }
    });
  </script>
{% endblock %}
