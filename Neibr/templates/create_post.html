{% extends "base.html" %}
{% block content %}
<div class="page-shell">
  <section class="page-hero-card">
    <div class="page-hero-main">
      <span class="hero-badge">Neibr 创作</span>
      <h1 class="hero-title">创建新帖子</h1>
      <p class="hero-subtitle">上传多媒体内容或写下精彩文案，与邻居们分享你的灵感瞬间。</p>
      <div class="card-panel-actions">
        <a class="glass-btn ghost" href="{{ url_for('neibr.index') }}">返回社区</a>
      </div>
    </div>
    <div class="page-hero-aside">
      <div class="hero-stats">
        <strong>支持多媒体</strong>
        <span>图片、视频、音频、文档一站式整理。</span>
      </div>
      <div class="hero-stats">
        <strong>灵活权限</strong>
        <span>勾选隐藏，内容仅自己可见。</span>
      </div>
    </div>
  </section>

  <section class="card-panel form-card">
    <form method="POST" enctype="multipart/form-data" class="form-stack">
      <div class="form-group">
        <label for="title">标题</label>
        <input type="text" id="title" name="title" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="tags">标签</label>
        <input type="text" id="tags" name="tags" class="form-control" placeholder="多个标签使用英文逗号分隔">
      </div>

      <div class="form-group">
        <label for="post_text">文案</label>
        <textarea id="post_text" name="post_text" class="form-control textarea-field" rows="6" placeholder="这一刻想对邻居说些什么？"></textarea>
      </div>

      <div class="form-group">
        <label for="files">上传媒体文件</label>
        <input type="file" id="files" name="files" class="input-file" multiple>
        <small>支持批量上传图片、视频、音频或常规文档。</small>
      </div>

      <div class="form-group">
        <label for="media_links">媒体链接（每行一个）</label>
        <textarea id="media_links" name="media_links" class="form-control textarea-field" rows="4" placeholder="https://your-cdn.com/sample.jpg&#10;https://video.aliyun.com/clip.mp4"></textarea>
        <small>支持 OSS、图床、YouTube 等公开链接，系统会自动识别类型。</small>
      </div>

      <div class="form-group">
        <label class="form-switch">
          <input type="checkbox" name="is_hidden">
          <span>隐藏（仅自己可见）</span>
        </label>
      </div>

      <div class="form-footer">
        <button type="submit" class="glass-btn">
          <span class="btn-text">发布帖子</span>
          <span aria-hidden="true">🚀</span>
        </button>
      </div>
    </form>
  </section>
</div>

<div class="form-overlay" id="create-post-overlay" aria-hidden="true">
  <div class="overlay-card">
    <p>正在上传，请稍候...</p>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.querySelector('.card-panel form');
  const overlay = document.getElementById('create-post-overlay');
  if (!form || !overlay) return;

  form.addEventListener('submit', () => {
    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden', 'false');
    const submitBtn = form.querySelector('button[type="submit"]');
    if (submitBtn) {
      submitBtn.disabled = true;
      const text = submitBtn.querySelector('.btn-text');
      if (text) text.textContent = '上传中...';
    }
  }, { once: true });
});
</script>
{% endblock %}
