{% extends "base.html" %}
{% block extra_styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/llm.css') }}">
{% endblock %}
{% block content %}
<div class="llm-result">
  <h1>问答</h1>
  {% if not configured %}
    <p>还没有配置 OPENAI_API_KEY。填进 .env 之后再来，这里才会向外发送问题。</p>
  {% endif %}
  <form method="POST" class="form-stack">
    <label for="query">问题</label>
    <textarea name="query" id="query" rows="4" class="form-control" required>{{ query or '' }}</textarea>
    <button type="submit" class="glass-btn">发送</button>
  </form>
  {% if answer %}
    <p><strong>回答：</strong>{{ answer }}</p>
  {% endif %}
  <a href="{{ url_for('index.home') }}">返回首页</a>
</div>
{% endblock %}
