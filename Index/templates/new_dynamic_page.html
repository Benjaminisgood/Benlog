{# templates/new_dynamic_page.html #}
{% extends 'base.html' %}
{% block content %}
<div class="new-page-container">
  <div class="npc-header">
    <h1 class="page-heading">新建动态页面</h1>
  </div>
  <form method="POST" id="new-page-form" class="new-page-form" novalidate>
    <div class="form-group">
      <label for="filename">页面文件名（filename）：</label>
      <input id="filename"
             name="filename"
             type="text"
             class="input-field"
             placeholder="仅限字母、数字、下划线和短横线"
             pattern="^[A-Za-z0-9_-]+$"
             required>
      <small class="hint">示例: my_page-1</small>
      <div class="error-message" id="filename-error">文件名格式不正确。</div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-save">创建并编辑</button>
      <a href="{{ url_for('setting.manage_dynamic_page') }}" class="btn btn-cancel">取消</a>
    </div>
  </form>
</div>

<script>
// 客户端验证文件名格式
(function() {
  const form = document.getElementById('new-page-form');
  const filenameInput = document.getElementById('filename');
  const errorDiv = document.getElementById('filename-error');

  filenameInput.addEventListener('input', () => {
    const valid = filenameInput.checkValidity();
    errorDiv.style.display = valid ? 'none' : 'block';
  });

  form.addEventListener('submit', (e) => {
    if (!filenameInput.checkValidity()) {
      e.preventDefault();
      errorDiv.style.display = 'block';
      filenameInput.focus();
    }
  });
})();
</script>

<style>
.new-page-container {
  max-width: 600px;
  margin: 3rem auto;
  padding: 2rem;
  background: var(--card-bg-color);
  border: 1px solid var(--card-border-color);
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.05);
}
.npc-header {
  text-align: center;
  margin-bottom: 1.5rem;
}
.page-heading {
  font-size: 2.2rem;
  color: var(--text-color);
}

.form-group {
  margin-bottom: 1.5rem;
  position: relative;
}

label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 500;
  color: var(--text-color);
}

.input-field {
  width: 100%;
  padding: 0.8rem 1rem;
  border: 1px solid var(--input-border-color);
  border-radius: 6px;
  background: var(--input-bg-color);
  transition: border-color 0.3s ease;
}
.input-field:focus {
  outline: none;
  border-color: var(--input-focus-border-color);
}

.hint {
  display: block;
  margin-top: 0.3rem;
  font-size: 0.85rem;
  color: var(--meta-text-color);
}

.error-message {
  display: none;
  margin-top: 0.3rem;
  font-size: 0.85rem;
  color: #dc3545;
}

.form-actions {
  text-align: center;
}

.btn {
  display: inline-block;
  padding: 0.6rem 1.4rem;
  margin: 0 0.5rem;
  border-radius: 6px;
  font-weight: 500;
  text-decoration: none;
  transition: all 0.3s ease;
}

.btn-save {
  background: var(--btn-bg-color);
  color: var(--btn-text-color);
  border: 1px solid var(--btn-bg-color);
}
.btn-save:hover {
  background: var(--btn-hover-bg-color);
  border-color: var(--btn-hover-bg-color);
}

.btn-cancel {
  background: transparent;
  color: var(--link-color);
  border: 1px solid var(--link-color);
}
.btn-cancel:hover {
  background: var(--quick-card-hover-bg);
  color: var(--text-color);
}

@media (max-width: 480px) {
  .new-page-container {
    padding: 1rem;
  }
  .btn {
    display: block;
    width: 100%;
    margin: 0.5rem 0;
  }
}
</style>
{% endblock %}
