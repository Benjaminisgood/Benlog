{% extends 'base.html' %}
{% block content %}
<div class="editor-shell">
  <section class="card-panel editor-hero">
    <div>
      <h1>编辑页面：{{ page }}</h1>
      <p class="editor-subtitle">拖拽式模块组合，快速打造属于你的动态页面。</p>
    </div>
    <div class="editor-toolbar">
      <button type="button" class="pill-btn accent-sky" onclick="add()">+ 添加元素</button>
    </div>
  </section>

  <form method="POST" id="edit-page-form" class="card-panel form-card editor-form">
    <div class="control-group">
      <label for="filename">文件名（不含 .json）：</label>
      <input id="filename"
             name="filename"
             type="text"
             class="input-field"
             required
             value="{{ page }}">
    </div>

    <input id="elements_count" name="elements_count" type="hidden" value="{{ page_components|length }}">

    <h3 class="section-heading">元素列表</h3>
    <div class="elements-stack" id="elements-container">
      {% for comp in page_components %}
        {% set idx = loop.index %}
        {% include 'partials/editor/_element_card.html' %}
      {% endfor %}
    </div>

    <div class="editor-actions">
      <button type="button" class="pill-btn neutral sm" onclick="add()">+ 添加元素</button>
      <button type="submit" class="pill-btn accent-sky">保存更改</button>
    </div>
  </form>
</div>

{% include 'partials/editor/_editor_templates.html' %}

<script>
  function reindex() {
    const container = document.getElementById('elements-container');
    const cards = container.querySelectorAll('.element-card');
    cards.forEach((card, i) => {
      const newIdx = i + 1;
      const oldIdx = card.dataset.index;
      card.dataset.index = newIdx;

      const main = card.querySelector(`[id^="main-"]`);
      if (main) main.id = `main-${newIdx}`;

      card.querySelectorAll('[name]').forEach(el => {
        el.name = el.name.replace(`elements-${oldIdx}-`, `elements-${newIdx}-`);
      });
      card.querySelectorAll('[id]').forEach(el => {
        el.id = el.id.replace(`-${oldIdx}`, `-${newIdx}`);
      });

      const sel = card.querySelector('select');
      if (sel) sel.setAttribute('onchange', `toggleExtra(${newIdx})`);

      card.querySelectorAll('.element-actions button').forEach(btn => {
        if (btn.textContent.includes('上移'))    btn.setAttribute('onclick', `move(${newIdx}, 'up')`);
        else if (btn.textContent.includes('下移')) btn.setAttribute('onclick', `move(${newIdx}, 'down')`);
        else if (btn.textContent.includes('删除')) btn.setAttribute('onclick', `remove(${newIdx})`);
      });
    });

    document.getElementById('elements_count').value = cards.length;
  }

  function getTemplate(type, idx) {
    const tpl = document.getElementById(`tmpl-${type}`);
    return tpl ? tpl.innerHTML.replace(/__IDX__/g, idx) : '';
  }

  function toggleExtra(idx) {
    const sel  = document.getElementsByName(`elements-${idx}-type`)[0];
    const main = document.getElementById(`main-${idx}`);
    if (sel && main) {
      main.innerHTML = getTemplate(sel.value, idx);
    }
  }

  function add() {
    const container = document.getElementById('elements-container');
    const idx = container.children.length + 1;
    const card = document.createElement('div');
    card.className = 'element-card';
    card.dataset.index = idx;
    card.innerHTML = `
      <div class="control-group">
        <label>类型：</label>
        <select name="elements-${idx}-type" class="select-field" onchange="toggleExtra(${idx})">
          {% for opt in ['title','text','link','quote','code','image','gallery','flipcard','faq','html'] %}
          <option value="{{ opt }}">{{ opt }}</option>
          {% endfor %}
        </select>
      </div>
      <div id="main-${idx}" class="control-group"></div>
      <div class="element-actions">
        <button type="button" class="pill-btn neutral sm">↑ 上移</button>
        <button type="button" class="pill-btn neutral sm">↓ 下移</button>
        <button type="button" class="pill-btn accent-rose sm">删除</button>
      </div>`;
    container.appendChild(card);
    toggleExtra(idx);
    card.querySelectorAll('.element-actions button').forEach(btn => {
      if (btn.textContent.includes('上移'))    btn.onclick = () => move(idx, 'up');
      else if (btn.textContent.includes('下移')) btn.onclick = () => move(idx, 'down');
      else if (btn.textContent.includes('删除')) btn.onclick = () => remove(idx);
    });
    reindex();
  }

  function remove(idx) {
    const el = document.querySelector(`.element-card[data-index='${idx}']`);
    if (el) el.remove();
    reindex();
  }

  function move(idx, dir) {
    const container = document.getElementById('elements-container');
    const el = document.querySelector(`.element-card[data-index='${idx}']`);
    if (!el) return;
    const sib = dir === 'up' ? el.previousElementSibling : el.nextElementSibling;
    if (sib) {
      container.insertBefore(dir === 'up' ? el : sib, dir === 'up' ? sib : el);
      reindex();
    }
  }
</script>
{% endblock %}
