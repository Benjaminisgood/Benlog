<template id="tmpl-title">
    <div class="control-group">
      <label>标题内容：</label>
      <input name="elements-__IDX__-content" class="input-field" placeholder="输入标题">
    </div>
  </template>
  <template id="tmpl-text">
    <div class="control-group">
      <label>文本内容：</label>
      <textarea name="elements-__IDX__-content" class="textarea-field" placeholder="输入文本"></textarea>
    </div>
  </template>
  <template id="tmpl-link">
    <div class="control-group">
      <label>链接地址：</label>
      <input name="elements-__IDX__-href" class="input-field" placeholder="https://...">
    </div>
    <div class="control-group">
      <label>链接文本：</label>
      <input name="elements-__IDX__-text" class="input-field" placeholder="显示文字">
    </div>
  </template>
  <template id="tmpl-quote">
    <div class="control-group">
      <label>引用内容：</label>
      <textarea name="elements-__IDX__-content" class="textarea-field" placeholder="输入引用"></textarea>
    </div>
  </template>
  <template id="tmpl-code">
    <div class="control-group">
      <label>代码内容：</label>
      <textarea name="elements-__IDX__-content" class="textarea-field" placeholder="输入代码"></textarea>
    </div>
    <div class="control-group">
      <label>代码语言：</label>
      <input name="elements-__IDX__-language" class="input-field" placeholder="例如 python">
    </div>
  </template>
  <template id="tmpl-image">
    <div class="control-group">
      <label>图片URL：</label>
      <input name="elements-__IDX__-src" class="input-field" placeholder="图片链接">
    </div>
    <div class="control-group">
      <label>图片描述：</label>
      <input name="elements-__IDX__-alt" class="input-field" placeholder="alt 文本">
    </div>
  </template>
  <template id="tmpl-gallery">
    <div class="control-group">
      <label>图片列表 (逗号分隔)：</label>
      <input name="elements-__IDX__-images" class="input-field" placeholder="url1,url2,...">
    </div>
  </template>
  <template id="tmpl-flipcard">
    <div class="control-group">
      <label>正面：</label>
      <input name="elements-__IDX__-front" class="input-field" placeholder="正面内容">
    </div>
    <div class="control-group">
      <label>背面：</label>
      <input name="elements-__IDX__-back" class="input-field" placeholder="背面内容">
    </div>
  </template>
  <template id="tmpl-faq">
    <div class="control-group">
      <label>问题：</label>
      <input name="elements-__IDX__-question" class="input-field" placeholder="输入问题">
    </div>
    <div class="control-group">
      <label>回答：</label>
      <textarea name="elements-__IDX__-answer" class="textarea-field" placeholder="输入回答"></textarea>
    </div>
  </template>
  <template id="tmpl-html">
    <div class="control-group">
      <label>HTML 代码：</label>
      <textarea name="elements-__IDX__-content" class="textarea-field" placeholder="原生 HTML"></textarea>
    </div>
  </template>
