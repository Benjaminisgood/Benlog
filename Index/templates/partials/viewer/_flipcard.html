<style>
.flip-card {
  perspective: 1000px;
  width: 100%;
  max-width: 320px;
  margin: 0 auto 1.5rem auto;
}
.flip-card-inner {
  position: relative;
  width: 100%;
  height: 200px;
  transform-style: preserve-3d;
  transition: transform 0.6s;
}
.flip-card:hover .flip-card-inner {
  transform: rotateY(180deg);
}
.flip-card-front, .flip-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 1rem;
}
.flip-card-back {
  transform: rotateY(180deg);
  background: var(--quick-card-bg);
  color: var(--text-color);
}
</style>
<div class="flip-card">
  <div class="flip-card-inner">
    <div class="flip-card-front">{{ elm.front }}</div>
    <div class="flip-card-back">{{ elm.back }}</div>
  </div>
</div>
